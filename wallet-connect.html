<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <title>DyorCult - Connect Wallet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 48px;
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            color: #1f2937;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #6b7280;
            text-align: center;
            margin-bottom: 32px;
            font-size: 15px;
        }

        .status {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }

        .status.info {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        .status.success {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .status.error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        button {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button.secondary {
            background: #10b981;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            margin-top: 12px;
        }

        .wallet-info {
            display: none;
            padding: 24px;
            background: #f9fafb;
            border-radius: 12px;
            margin-top: 24px;
            border: 1px solid #e5e7eb;
        }

        .wallet-info.show {
            display: block;
        }

        .wallet-label {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .pubkey {
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 13px;
            word-break: break-all;
            padding: 12px;
            background: white;
            border-radius: 8px;
            color: #1f2937;
            border: 1px solid #e5e7eb;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            padding: 12px;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 8px;
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎮</div>
        <h1>DyorCult</h1>
        <p class="subtitle">Connect your Seeker wallet to unlock exclusive in-game features</p>

        <div id="status" class="status info">
            <span>Ready to connect</span>
        </div>

        <button id="connectBtn" onclick="connectWallet()">
            <span id="btnText">Connect Seeker Wallet</span>
        </button>

        <button id="returnBtn" onclick="returnToGame()" class="secondary" style="display:none;">
            <span>Return to Game →</span>
        </button>

        <div id="walletInfo" class="wallet-info">
            <div class="wallet-label">Connected Wallet</div>
            <div id="pubkey" class="pubkey"></div>
        </div>

        <div class="security-badge">
            🔒 Secured via Solana Mobile Wallet Adapter
        </div>
    </div>

    <script>
        const CONFIG = {
            DEEP_LINK_SCHEME: 'dyorcult',
            SESSION_KEY: 'dyorcult_session',
            WALLET_KEY: 'dyorcult_wallet_pubkey',
            TIMESTAMP_KEY: 'dyorcult_wallet_timestamp',
            SESSION_DURATION: 24 * 60 * 60 * 1000
        };

        let walletPublicKey = null;

        function generateSessionToken() {
            const array = new Uint8Array(32);
            crypto.getRandomValues(array);
            return Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
        }

        function getSessionToken() {
            let session = localStorage.getItem(CONFIG.SESSION_KEY);
            if (!session) {
                session = generateSessionToken();
                localStorage.setItem(CONFIG.SESSION_KEY, session);
            }
            return session;
        }

        function setStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.className = `status ${type}`;
            status.innerHTML = `<span>${message}</span>`;
        }

        function setButtonText(text, showSpinner = false) {
            const btnText = document.getElementById('btnText');
            btnText.innerHTML = showSpinner
                ? `<span class="spinner"></span>${text}`
                : text;
        }

        async function connectWallet() {
            const btn = document.getElementById('connectBtn');

            try {
                btn.disabled = true;
                setButtonText('Opening wallet...', true);
                setStatus('Launching Seeker wallet...', 'info');

                const session = getSessionToken();

                // Build the callback URL that includes our session
                const callbackUrl = window.location.href.split('?')[0] + '?session=' + session;

                // Create app identity for Mobile Wallet Adapter
                const appIdentity = {
                    name: 'DyorCult',
                    uri: window.location.origin,
                    icon: window.location.origin + '/icon.png'
                };

                // Encode parameters
                const encodedIdentity = encodeURIComponent(JSON.stringify(appIdentity));
                const encodedCallback = encodeURIComponent(callbackUrl);

                // Use the correct MWA protocol
                // Format: solana-wallet://v1/associate/local?app_identity={...}&callback={...}
                const mwaUrl = `solana-wallet://v1/associate/local?app_identity=${encodedIdentity}&callback=${encodedCallback}`;

                console.log('[DyorCult] MWA URL:', mwaUrl);
                console.log('[DyorCult] Callback URL:', callbackUrl);

                // Open the native Seeker wallet
                window.location.href = mwaUrl;

                // Note: User will be redirected, so button state doesn't matter

            } catch (err) {
                console.error('[DyorCult] Connection error:', err);
                setStatus('❌ ' + err.message, 'error');
                btn.disabled = false;
                setButtonText('Try Again');
            }
        }

        function returnToGame() {
            if (!walletPublicKey) {
                setStatus('No wallet connected', 'error');
                return;
            }

            setStatus('Returning to game...', 'info');

            const session = getSessionToken();
            const deepLink = `${CONFIG.DEEP_LINK_SCHEME}://wallet-connected?pubkey=${encodeURIComponent(walletPublicKey)}&session=${encodeURIComponent(session)}&timestamp=${Date.now()}`;

            console.log('[DyorCult] Returning to game:', deepLink);
            window.location.href = deepLink;

            setTimeout(() => {
                setStatus('Please open the DyorCult app to continue', 'info');
            }, 1500);
        }

        // Handle page load - check for wallet connection callback
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);

            // Check if we're returning from MWA with authorization
            if (urlParams.has('phantom_encryption_public_key') || urlParams.has('solana_public_key') || urlParams.has('public_key')) {
                // MWA returned with authorization
                walletPublicKey = urlParams.get('solana_public_key') || urlParams.get('public_key') || urlParams.get('phantom_encryption_public_key');

                if (walletPublicKey) {
                    const session = getSessionToken();
                    const timestamp = Date.now();

                    localStorage.setItem(CONFIG.WALLET_KEY, walletPublicKey);
                    localStorage.setItem(CONFIG.TIMESTAMP_KEY, timestamp.toString());

                    setStatus('✅ Wallet connected successfully!', 'success');
                    document.getElementById('pubkey').textContent = walletPublicKey;
                    document.getElementById('walletInfo').classList.add('show');
                    document.getElementById('connectBtn').style.display = 'none';
                    document.getElementById('returnBtn').style.display = 'block';

                    console.log('[DyorCult] Wallet connected:', walletPublicKey);

                    // Auto-return to game after 2 seconds
                    setTimeout(() => {
                        returnToGame();
                    }, 2000);
                    return;
                }
            }

            // Check for existing valid session
            const savedWallet = localStorage.getItem(CONFIG.WALLET_KEY);
            const savedTimestamp = parseInt(localStorage.getItem(CONFIG.TIMESTAMP_KEY) || '0');
            const now = Date.now();

            if (savedWallet && (now - savedTimestamp) < CONFIG.SESSION_DURATION) {
                walletPublicKey = savedWallet;
                setStatus('✅ Wallet session active', 'success');
                document.getElementById('pubkey').textContent = walletPublicKey;
                document.getElementById('walletInfo').classList.add('show');
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('returnBtn').style.display = 'block';
            }
        });
    </script>
</body>
</html>
